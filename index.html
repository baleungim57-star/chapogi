<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>차뽀기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    min-height:100%;
    background:#0d1210;
    color:#e8ece7;
    font-family:'Rajdhani', sans-serif;
    overflow-y:auto;
  }

  #app {
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* subtle contour background */
  .bg {
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 30% 20%, rgba(255,107,53,0.05), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,107,53,0.04), transparent 45%);
    pointer-events:none;
  }

  header {
    padding:22px 24px 14px;
    position:relative;
    z-index:2;
  }
  .logo {
    font-size:26px;
    font-weight:700;
    letter-spacing:1px;
    color:#f5f5f0;
  }
  .logo span { color:#ff6b35; }
  .tagline {
    font-size:12.5px;
    color:#7c8a7a;
    letter-spacing:2px;
    margin-top:2px;
    text-transform:uppercase;
    font-weight:500;
  }

  main {
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 24px 40px;
    position:relative;
    z-index:2;
    gap:26px;
  }

  .panel {
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .section-label {
    font-size:13px;
    color:#7c8a7a;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:600;
    margin-bottom:10px;
  }

  /* radius chips */
  .radius-row {
    display:flex;
    gap:8px;
  }

  .toggle-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#121714;
    border:1px solid #232b26;
    border-radius:12px;
    padding:14px 16px;
  }
  .toggle-row .tlabel {
    font-size:15px;
    font-weight:600;
    color:#dfe6db;
  }
  .toggle-row .tsub {
    font-size:11.5px;
    color:#5c6b59;
    margin-top:2px;
  }
  .switch {
    position:relative;
    width:48px;
    height:28px;
    flex-shrink:0;
    border-radius:16px;
    background:#2a332c;
    cursor:pointer;
    transition:background .2s ease;
  }
  .switch.on { background:#ff6b35; }
  .switch .knob {
    position:absolute;
    top:3px; left:3px;
    width:22px; height:22px;
    border-radius:50%;
    background:#e8ece7;
    transition:transform .2s ease;
  }
  .switch.on .knob { transform:translateX(20px); }

  .region-wrap {
    background:#121714;
    border:1px solid #232b26;
    border-radius:12px;
    padding:14px 16px;
    transition:opacity .2s ease;
  }
  .region-wrap.disabled { opacity:0.35; pointer-events:none; }
  .region-wrap .rlabel2 {
    font-size:11px;
    color:#5c6b59;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:10px;
    font-weight:600;
  }
  select#regionSelect {
    width:100%;
    background:#161c19;
    border:1px solid #263028;
    border-radius:10px;
    color:#e8ece7;
    font-family:'Rajdhani', sans-serif;
    font-size:16px;
    font-weight:600;
    padding:12px 14px;
    appearance:none;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237c8a7a'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:18px;
    cursor:pointer;
  }
  select#regionSelect:focus { outline:none; border-color:#ff6b35; }

  .minimap-wrap {
    background:#121714;
    border:1px solid #232b26;
    border-radius:14px;
    padding:16px;
    display:none;
  }
  .minimap-wrap .rlabel2 {
    font-size:11px;
    color:#5c6b59;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:10px;
    font-weight:600;
  }
  .minimap-wrap svg { display:block; margin:0 auto; }
  .kr-outline { fill:#1a211c; stroke:#2f3a32; stroke-width:1.5; }
  .kr-marker {
    fill:#ff6b35;
    stroke:#0d1210;
    stroke-width:2;
  }
  .kr-marker-unknown {
    fill:#3a453d;
    stroke:#0d1210;
    stroke-width:2;
  }
  .chip {
    flex:1;
    padding:12px 0;
    text-align:center;
    background:#161c19;
    border:1px solid #263028;
    border-radius:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    font-weight:500;
    color:#9caa98;
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip.active {
    background:rgba(255,107,53,0.12);
    border-color:#ff6b35;
    color:#ff6b35;
    font-weight:700;
  }

  /* coord readout */
  .readout {
    background:#121714;
    border:1px solid #232b26;
    border-radius:14px;
    padding:18px 20px;
    font-family:'JetBrains Mono', monospace;
  }
  .readout .rlabel {
    font-size:11px;
    color:#5c6b59;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .readout .rval {
    font-size:19px;
    color:#e8ece7;
    letter-spacing:0.5px;
  }
  .readout .rval.dim { color:#4a564a; }

  button.primary {
    width:100%;
    padding:18px 0;
    border:none;
    border-radius:14px;
    background:#ff6b35;
    color:#0d1210;
    font-family:'Rajdhani', sans-serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  button.primary:active { transform:scale(0.98); }
  button.primary:disabled {
    background:#2a332c;
    color:#5c6b59;
  }

  button.ghost {
    width:100%;
    padding:14px 0;
    border:1px solid #2a332c;
    border-radius:14px;
    background:transparent;
    color:#9caa98;
    font-family:'Rajdhani', sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }

  .status {
    text-align:center;
    font-size:13px;
    color:#5c6b59;
    min-height:18px;
    font-weight:500;
  }
  .status.err { color:#e05a4e; }
  .status.ok { color:#5cad7a; }

  /* FINDING MODE */
  #findScreen {
    position:fixed;
    inset:0;
    background:#0d1210;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:10;
    gap:8px;
  }
  #findScreen.show { display:flex; }

  .find-label {
    font-size:13px;
    letter-spacing:3px;
    color:#7c8a7a;
    text-transform:uppercase;
    font-weight:600;
    margin-bottom:6px;
  }

  .ring-wrap {
    position:relative;
    width:280px;
    height:280px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring-wrap svg { position:absolute; inset:0; transform:rotate(-90deg); }
  .ring-bg { fill:none; stroke:#1c2420; stroke-width:8; }
  .ring-fg {
    fill:none;
    stroke:#ff6b35;
    stroke-width:8;
    stroke-linecap:round;
    transition:stroke-dashoffset .4s ease, stroke .3s ease;
  }

  .dist-num {
    font-family:'JetBrains Mono', monospace;
    font-size:44px;
    font-weight:700;
    color:#f5f5f0;
    letter-spacing:-1px;
  }
  .dist-unit {
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:#7c8a7a;
    letter-spacing:1px;
    margin-top:2px;
  }

  .arrived {
    color:#ff6b35 !important;
  }

  .find-exit {
    margin-top:36px;
    padding:12px 28px;
    border:1px solid #2a332c;
    border-radius:10px;
    background:transparent;
    color:#7c8a7a;
    font-family:'Rajdhani', sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }

  .pulse {
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:0.55; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="bg"></div>

  <header>
    <div class="logo">차<span>뽀</span>기</div>
    <div class="tagline">Coordinate Survival</div>
  </header>

  <main>
    <div class="panel" id="setupPanel">

      <div>
        <div class="section-label">반경 설정</div>
        <div class="radius-row" id="radiusRow">
          <div class="chip active" data-r="10">10km</div>
          <div class="chip" data-r="20">20km</div>
          <div class="chip" data-r="30">30km</div>
          <div class="chip" data-r="40">40km</div>
          <div class="chip" data-r="50">50km</div>
        </div>
      </div>

      <div class="toggle-row">
        <div>
          <div class="tlabel">1스팟을 현재 위치로 설정</div>
          <div class="tsub">끄면 아래 지역 내 랜덤 좌표로 시작</div>
        </div>
        <div class="switch" id="useGpsToggle"><div class="knob"></div></div>
      </div>

      <div class="region-wrap" id="regionWrap">
        <div class="rlabel2">지역 선택</div>
        <select id="regionSelect">
          <option value="all">전체</option>
          <option value="gg">경기도</option>
          <option value="gw">강원도</option>
          <option value="cb">충청북도</option>
          <option value="cn">충청남도</option>
          <option value="jb">전라북도</option>
          <option value="jn">전라남도</option>
          <option value="gb">경상북도</option>
          <option value="gn">경상남도</option>
          <option value="jj">제주도</option>
        </select>
      </div>

      <div class="readout">
        <div class="rlabel">출발 지점 (1번 스팟)</div>
        <div class="rval dim" id="startVal">미확정</div>
      </div>

      <button class="primary" id="btnStart">1번 스팟 찍기 (랜덤)</button>

      <div class="readout" id="targetReadout" style="display:none;">
        <div class="rlabel">타겟 스팟</div>
        <div class="rval" id="targetVal">생성됨</div>
      </div>

      <div class="toggle-row" id="revealWrap">
        <div>
          <div class="tlabel">타겟 좌표 공개</div>
          <div class="tsub">끄면 좌표를 숨기고 거리만 표시</div>
        </div>
        <div class="switch on" id="revealToggle"><div class="knob"></div></div>
      </div>

      <button class="primary" id="btnSpot" style="display:none;">타겟 스팟 생성</button>

      <div class="minimap-wrap" id="minimapWrap">
        <div class="rlabel2">타겟 위치</div>
        <svg id="krSvg" viewBox="0 0 260 380" width="220" height="322">
          <polygon class="kr-outline" id="krPolygon" points=""></polygon>
          <circle class="kr-outline" id="jejuCircle" cx="0" cy="0" r="10"></circle>
          <circle id="targetMarker" cx="-100" cy="-100" r="6" class="kr-marker"></circle>
        </svg>
      </div>
      <button class="primary" id="btnFind" style="display:none;">찾기 모드 시작</button>
      <button class="ghost" id="btnReset" style="display:none;">처음부터 다시</button>

      <div class="status" id="statusMsg"></div>
    </div>
  </main>

  <div id="findScreen">
    <div class="find-label" id="findLabel">TARGET DISTANCE</div>
    <div class="ring-wrap">
      <svg viewBox="0 0 280 280">
        <circle class="ring-bg" cx="140" cy="140" r="120"></circle>
        <circle class="ring-fg" id="ringFg" cx="140" cy="140" r="120" stroke-dasharray="754" stroke-dashoffset="0"></circle>
      </svg>
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div class="dist-num" id="distNum">--</div>
        <div class="dist-unit">KM</div>
      </div>
    </div>
    <button class="find-exit" id="btnExitFind">찾기 모드 종료</button>
  </div>

</div>

<script>
  const R_EARTH = 6371; // km
  let radiusKm = 10;
  let useGps = false;
  let revealCoords = true;
  let startCoord = null;   // {lat, lng}
  let targetCoord = null;  // {lat, lng}
  let watchId = null;

  // 대한민국 및 도별 대략 경계 (근사 바운딩 박스, 콘텐츠용 간이 버전)
  const REGION_BOUNDS = {
    all: { latMin: 33.1, latMax: 38.6, lngMin: 125.0, lngMax: 129.6 },
    gg:  { latMin: 36.9, latMax: 38.3, lngMin: 126.3, lngMax: 127.9 }, // 경기도
    gw:  { latMin: 37.0, latMax: 38.6, lngMin: 127.5, lngMax: 129.4 }, // 강원도
    cb:  { latMin: 36.0, latMax: 37.2, lngMin: 127.3, lngMax: 128.6 }, // 충청북도
    cn:  { latMin: 35.9, latMax: 37.0, lngMin: 125.9, lngMax: 127.5 }, // 충청남도
    jb:  { latMin: 35.3, latMax: 36.2, lngMin: 126.4, lngMax: 127.9 }, // 전라북도
    jn:  { latMin: 33.9, latMax: 35.5, lngMin: 125.0, lngMax: 127.8 }, // 전라남도
    gb:  { latMin: 35.6, latMax: 37.0, lngMin: 128.0, lngMax: 129.6 }, // 경상북도
    gn:  { latMin: 34.6, latMax: 35.9, lngMin: 127.5, lngMax: 129.3 }, // 경상남도
    jj:  { latMin: 33.1, latMax: 33.6, lngMin: 126.1, lngMax: 126.9 }  // 제주도
  };

  function randomKoreaPoint() {
    const region = regionSelect.value;
    const b = REGION_BOUNDS[region] || REGION_BOUNDS.all;
    const lat = b.latMin + Math.random() * (b.latMax - b.latMin);
    const lng = b.lngMin + Math.random() * (b.lngMax - b.lngMin);
    return { lat, lng };
  }

  // ---- 미니맵 (대략적인 남한 윤곽) ----
  const MAP_BOUNDS = { latMin: 33.0, latMax: 38.4, lngMin: 125.9, lngMax: 129.6 };
  const MAP_W = 260, MAP_H = 380, MAP_PAD = 22;

  const KR_OUTLINE_LATLNG = [
    [37.75,126.35],[37.45,126.60],[36.95,126.20],[36.60,126.45],
    [35.97,126.66],[35.35,126.40],[34.95,126.40],[34.55,126.55],
    [34.35,126.60],[34.45,127.15],[34.60,127.50],[34.76,127.66],
    [34.85,128.10],[35.00,128.60],[35.10,129.04],[35.55,129.35],
    [36.00,129.36],[36.55,129.45],[37.20,129.20],[37.75,128.90],
    [38.20,128.55],[38.30,128.35],[38.15,127.50],[37.95,126.90]
  ];
  const JEJU_LATLNG = [33.38, 126.55];

  function project(lat, lng) {
    const x = MAP_PAD + ((lng - MAP_BOUNDS.lngMin) / (MAP_BOUNDS.lngMax - MAP_BOUNDS.lngMin)) * (MAP_W - MAP_PAD*2);
    const y = MAP_PAD + ((MAP_BOUNDS.latMax - lat) / (MAP_BOUNDS.latMax - MAP_BOUNDS.latMin)) * (MAP_H - MAP_PAD*2);
    return { x, y };
  }

  const krPolygon = document.getElementById('krPolygon');
  const jejuCircle = document.getElementById('jejuCircle');
  const targetMarker = document.getElementById('targetMarker');
  const minimapWrap = document.getElementById('minimapWrap');

  (function drawOutline() {
    const pts = KR_OUTLINE_LATLNG.map(([la,ln]) => {
      const p = project(la, ln);
      return p.x.toFixed(1) + ',' + p.y.toFixed(1);
    }).join(' ');
    krPolygon.setAttribute('points', pts);
    const jp = project(JEJU_LATLNG[0], JEJU_LATLNG[1]);
    jejuCircle.setAttribute('cx', jp.x.toFixed(1));
    jejuCircle.setAttribute('cy', jp.y.toFixed(1));
  })();

  function renderMinimap() {
    if (!targetCoord) { minimapWrap.style.display = 'none'; return; }
    minimapWrap.style.display = 'block';
    if (revealCoords) {
      const p = project(
        Math.min(Math.max(targetCoord.lat, MAP_BOUNDS.latMin - 0.6), MAP_BOUNDS.latMax + 0.3),
        Math.min(Math.max(targetCoord.lng, MAP_BOUNDS.lngMin - 0.6), MAP_BOUNDS.lngMax + 0.3)
      );
      targetMarker.setAttribute('cx', p.x.toFixed(1));
      targetMarker.setAttribute('cy', p.y.toFixed(1));
      targetMarker.setAttribute('class', 'kr-marker');
      targetMarker.setAttribute('r', 6);
    } else {
      targetMarker.setAttribute('cx', -100);
      targetMarker.setAttribute('cy', -100);
    }
  }

  const statusMsg = document.getElementById('statusMsg');
  const startVal = document.getElementById('startVal');
  const targetReadout = document.getElementById('targetReadout');
  const btnStart = document.getElementById('btnStart');
  const btnSpot = document.getElementById('btnSpot');
  const btnFind = document.getElementById('btnFind');
  const btnReset = document.getElementById('btnReset');
  const findScreen = document.getElementById('findScreen');
  const distNum = document.getElementById('distNum');
  const ringFg = document.getElementById('ringFg');
  const findLabel = document.getElementById('findLabel');

  const RING_CIRC = 2 * Math.PI * 120;
  ringFg.setAttribute('stroke-dasharray', RING_CIRC.toFixed(1));

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      radiusKm = parseInt(chip.dataset.r, 10);
    });
  });

  function setStatus(msg, type) {
    statusMsg.textContent = msg || '';
    statusMsg.className = 'status' + (type ? ' ' + type : '');
  }

  function toRad(deg) { return deg * Math.PI / 180; }

  function haversine(a, b) {
    const dLat = toRad(b.lat - a.lat);
    const dLng = toRad(b.lng - a.lng);
    const lat1 = toRad(a.lat);
    const lat2 = toRad(b.lat);
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    return 2 * R_EARTH * Math.asin(Math.sqrt(h));
  }

  // random point within radiusKm of start, uniform over the disk area
  function randomPointWithin(center, maxKm) {
    const u = Math.random();
    const v = Math.random();
    const w = maxKm * Math.sqrt(u);
    const t = 2 * Math.PI * v;
    const dLat = (w * Math.cos(t)) / R_EARTH;
    const dLng = (w * Math.sin(t)) / (R_EARTH * Math.cos(toRad(center.lat)));
    return {
      lat: center.lat + dLat * 180 / Math.PI,
      lng: center.lng + dLng * 180 / Math.PI
    };
  }

  function fmtCoord(c) {
    return c.lat.toFixed(5) + ', ' + c.lng.toFixed(5);
  }

  const useGpsToggle = document.getElementById('useGpsToggle');
  const regionSelect = document.getElementById('regionSelect');
  const regionWrap = document.getElementById('regionWrap');

  useGpsToggle.addEventListener('click', () => {
    useGps = !useGps;
    useGpsToggle.classList.toggle('on', useGps);
    regionWrap.classList.toggle('disabled', useGps);
    btnStart.textContent = useGps ? '1번 스팟 찍기 (현재 위치)' : '1번 스팟 찍기 (랜덤)';
  });

  function confirmStart(coord) {
    startCoord = coord;
    startVal.textContent = fmtCoord(startCoord);
    startVal.classList.remove('dim');
    btnSpot.style.display = 'block';
    btnStart.textContent = useGps ? '1번 스팟 다시 찍기' : '1번 스팟 다시 찍기';
  }

  function getStartFromGps(highAcc) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        confirmStart({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        setStatus('현재 위치로 1번 스팟이 설정됐어요', 'ok');
      },
      err => {
        if (highAcc && err.code === err.TIMEOUT) {
          getStartFromGps(false);
          return;
        }
        if (err.code === err.PERMISSION_DENIED) {
          setStatus('위치 권한이 거부됐어요. 브라우저 설정을 확인해주세요', 'err');
        } else if (err.code === err.POSITION_UNAVAILABLE) {
          setStatus('GPS 신호 없음 · 실외로 이동해보세요', 'err');
        } else {
          setStatus('위치 확인이 지연되고 있어요. 다시 시도해주세요', 'err');
        }
      },
      { enableHighAccuracy: highAcc, timeout: highAcc ? 8000 : 20000, maximumAge: 2000 }
    );
  }

  btnStart.addEventListener('click', () => {
    if (useGps) {
      if (!navigator.geolocation) {
        setStatus('이 브라우저는 위치 정보를 지원하지 않아요', 'err');
        return;
      }
      setStatus('위치 확인 중...');
      getStartFromGps(true);
    } else {
      confirmStart(randomKoreaPoint());
      setStatus('선택한 지역 내 랜덤 지점으로 1번 스팟이 설정됐어요', 'ok');
    }
  });

  const revealToggle = document.getElementById('revealToggle');
  const targetValEl = document.getElementById('targetVal');

  function renderTargetVal() {
    if (!targetCoord) return;
    targetValEl.textContent = revealCoords
      ? fmtCoord(targetCoord)
      : '생성됨 · 좌표 비공개 (반경 ' + radiusKm + 'km)';
  }

  revealToggle.addEventListener('click', () => {
    revealCoords = !revealCoords;
    revealToggle.classList.toggle('on', revealCoords);
    renderTargetVal();
    renderMinimap();
  });

  btnSpot.addEventListener('click', () => {
    if (!startCoord) return;
    targetCoord = randomPointWithin(startCoord, radiusKm);
    targetReadout.style.display = 'block';
    renderTargetVal();
    renderMinimap();
    btnFind.style.display = 'block';
    btnReset.style.display = 'block';
    btnSpot.textContent = '타겟 스팟 다시 생성';
    setStatus('타겟이 정해졌어요. 출발하세요!', 'ok');
  });

  btnReset.addEventListener('click', () => {
    startCoord = null;
    targetCoord = null;
    startVal.textContent = '미확정';
    startVal.classList.add('dim');
    targetReadout.style.display = 'none';
    minimapWrap.style.display = 'none';
    btnSpot.style.display = 'none';
    btnFind.style.display = 'none';
    btnReset.style.display = 'none';
    btnStart.textContent = useGps ? '1번 스팟 찍기 (현재 위치)' : '1번 스팟 찍기 (랜덤)';
    btnSpot.textContent = '타겟 스팟 생성';
    setStatus('');
  });

  btnFind.addEventListener('click', () => {
    if (!targetCoord) return;
    findScreen.classList.add('show');
    startWatch();
  });

  document.getElementById('btnExitFind').addEventListener('click', () => {
    stopWatch();
    findScreen.classList.remove('show');
  });

  function startWatch() {
    if (!navigator.geolocation) {
      findLabel.textContent = '위치 기능 미지원';
      return;
    }
    doWatch(true);
  }

  function doWatch(highAcc) {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(
      pos => {
        const here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const dKm = haversine(here, targetCoord);
        updateFindUI(dKm);
      },
      err => {
        if (highAcc && err.code === err.TIMEOUT) {
          // 정밀 GPS가 안 잡히면 저정밀 모드로 재시도
          doWatch(false);
          return;
        }
        if (err.code === err.PERMISSION_DENIED) {
          findLabel.textContent = '위치 권한이 거부됐어요';
        } else if (err.code === err.POSITION_UNAVAILABLE) {
          findLabel.textContent = 'GPS 신호 없음 · 실외로 이동해보세요';
        } else {
          findLabel.textContent = 'GPS 신호 대기 중...';
        }
      },
      { enableHighAccuracy: highAcc, maximumAge: 2000, timeout: highAcc ? 8000 : 20000 }
    );
  }

  function stopWatch() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
  }

  function updateFindUI(dKm) {
    const arrived = dKm < 0.05; // 50m
    distNum.textContent = arrived ? '도착' : dKm.toFixed(2);
    distNum.classList.toggle('arrived', arrived);
    distNum.classList.toggle('pulse', arrived);
    findLabel.textContent = arrived ? 'TARGET REACHED' : 'TARGET DISTANCE';

    // ring: fill inversely proportional to distance vs initial radius setting
    const ratio = Math.max(0, Math.min(1, 1 - (dKm / radiusKm)));
    const offset = RING_CIRC * (1 - ratio);
    ringFg.style.strokeDashoffset = offset.toFixed(1);
    ringFg.style.stroke = arrived ? '#5cad7a' : '#ff6b35';
  }
</script>
</body>
</html>
