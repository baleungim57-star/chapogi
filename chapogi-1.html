<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>차뽀기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    background:#0d1210;
    color:#e8ece7;
    font-family:'Rajdhani', sans-serif;
  }

  #app {
    min-height:100vh;
    position:relative;
  }

  /* subtle contour background */
  .bg {
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 30% 20%, rgba(255,107,53,0.05), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,107,53,0.04), transparent 45%);
    pointer-events:none;
  }

  header {
    padding:22px 24px 14px;
    position:relative;
    z-index:2;
  }
  .logo {
    font-size:26px;
    font-weight:700;
    letter-spacing:1px;
    color:#f5f5f0;
  }
  .logo span { color:#ff6b35; }
  .tagline {
    font-size:12.5px;
    color:#7c8a7a;
    letter-spacing:2px;
    margin-top:2px;
    text-transform:uppercase;
    font-weight:500;
  }

  main {
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 24px 40px;
    position:relative;
    z-index:2;
    gap:26px;
  }

  .panel {
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .section-label {
    font-size:13px;
    color:#7c8a7a;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:600;
    margin-bottom:10px;
  }

  /* radius chips */
  .radius-row {
    display:flex;
    gap:8px;
  }

  .toggle-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#121714;
    border:1px solid #232b26;
    border-radius:12px;
    padding:14px 16px;
  }
  .toggle-row .tlabel {
    font-size:15px;
    font-weight:600;
    color:#dfe6db;
  }
  .toggle-row .tsub {
    font-size:11.5px;
    color:#5c6b59;
    margin-top:2px;
  }
  .switch {
    position:relative;
    width:48px;
    height:28px;
    flex-shrink:0;
    border-radius:16px;
    background:#2a332c;
    cursor:pointer;
    transition:background .2s ease;
  }
  .switch.on { background:#ff6b35; }
  .switch .knob {
    position:absolute;
    top:3px; left:3px;
    width:22px; height:22px;
    border-radius:50%;
    background:#e8ece7;
    transition:transform .2s ease;
  }
  .switch.on .knob { transform:translateX(20px); }

  .region-wrap {
    background:#121714;
    border:1px solid #232b26;
    border-radius:12px;
    padding:14px 16px;
    transition:opacity .2s ease;
  }
  .region-wrap.disabled { opacity:0.35; pointer-events:none; }
  .region-wrap .rlabel2 {
    font-size:11px;
    color:#5c6b59;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:10px;
    font-weight:600;
  }
  select#regionSelect {
    width:100%;
    background:#161c19;
    border:1px solid #263028;
    border-radius:10px;
    color:#e8ece7;
    font-family:'Rajdhani', sans-serif;
    font-size:16px;
    font-weight:600;
    padding:12px 14px;
    appearance:none;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237c8a7a'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:18px;
    cursor:pointer;
  }
  select#regionSelect:focus { outline:none; border-color:#ff6b35; }
  .chip {
    flex:1;
    padding:12px 0;
    text-align:center;
    background:#161c19;
    border:1px solid #263028;
    border-radius:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    font-weight:500;
    color:#9caa98;
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip.active {
    background:rgba(255,107,53,0.12);
    border-color:#ff6b35;
    color:#ff6b35;
    font-weight:700;
  }

  /* coord readout */
  .readout {
    background:#121714;
    border:1px solid #232b26;
    border-radius:14px;
    padding:18px 20px;
    font-family:'JetBrains Mono', monospace;
  }
  .readout .rlabel {
    font-size:11px;
    color:#5c6b59;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .readout .rval {
    font-size:19px;
    color:#e8ece7;
    letter-spacing:0.5px;
  }
  .readout .rval.dim { color:#4a564a; }

  button.primary {
    width:100%;
    padding:18px 0;
    border:none;
    border-radius:14px;
    background:#ff6b35;
    color:#0d1210;
    font-family:'Rajdhani', sans-serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  button.primary:active { transform:scale(0.98); }
  button.primary:disabled {
    background:#2a332c;
    color:#5c6b59;
  }

  button.ghost {
    width:100%;
    padding:14px 0;
    border:1px solid #2a332c;
    border-radius:14px;
    background:transparent;
    color:#9caa98;
    font-family:'Rajdhani', sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }

  .status {
    text-align:center;
    font-size:13px;
    color:#5c6b59;
    min-height:18px;
    font-weight:500;
  }
  .status.err { color:#e05a4e; }
  .status.ok { color:#5cad7a; }

  /* FINDING MODE */
  #findScreen {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    height:100dvh;
    background:#0d1210;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    z-index:10;
    gap:8px;
    overflow-y:scroll;
    -webkit-overflow-scrolling:touch;
    padding:60px 24px 40px;
  }
  #findScreen.show { display:flex; }

  .find-label {
    font-size:13px;
    letter-spacing:3px;
    color:#7c8a7a;
    text-transform:uppercase;
    font-weight:600;
    margin-bottom:6px;
  }

  .ring-wrap {
    position:relative;
    width:280px;
    height:280px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring-wrap svg { position:absolute; inset:0; transform:rotate(-90deg); }
  .ring-bg { fill:none; stroke:#1c2420; stroke-width:8; }
  .ring-fg {
    fill:none;
    stroke:#ff6b35;
    stroke-width:8;
    stroke-linecap:round;
    transition:stroke-dashoffset .4s ease, stroke .3s ease;
  }

  .dist-num {
    font-family:'JetBrains Mono', monospace;
    font-size:44px;
    font-weight:700;
    color:#f5f5f0;
    letter-spacing:-1px;
  }
  .dist-unit {
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:#7c8a7a;
    letter-spacing:1px;
    margin-top:2px;
  }

  .arrived {
    color:#ff6b35 !important;
  }

  .find-exit {
    margin-top:36px;
    padding:12px 28px;
    border:1px solid #2a332c;
    border-radius:10px;
    background:transparent;
    color:#7c8a7a;
    font-family:'Rajdhani', sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }

  .pulse {
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:0.55; }
  }

  .log-panel {
    width:100%;
    max-width:340px;
    max-height:170px;
    overflow-y:auto;
    margin-top:26px;
    background:#121714;
    border:1px solid #232b26;
    border-radius:12px;
    padding:10px 12px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    line-height:1.6;
    color:#9caa98;
  }
  .log-panel .log-line { white-space:nowrap; }
  .log-panel .log-line:first-child { color:#ff6b35; }
  .log-panel::-webkit-scrollbar { width:4px; }
  .log-panel::-webkit-scrollbar-thumb { background:#2a332c; border-radius:2px; }

  .hist-card {
    background:#121714;
    border:1px solid #232b26;
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .hist-card .htitle {
    font-size:14.5px;
    font-weight:600;
    color:#dfe6db;
  }
  .hist-card .hsub {
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:#7c8a7a;
  }
  .hist-card .hbtns {
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .hist-card button {
    flex:1;
    padding:9px 0;
    border:1px solid #2a332c;
    border-radius:8px;
    background:transparent;
    color:#9caa98;
    font-family:'Rajdhani', sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .hist-empty {
    text-align:center;
    color:#5c6b59;
    font-size:13px;
    padding:20px 0;
  }
</style>
</head>
<body>
<div id="app">
  <div class="bg"></div>

  <header>
    <div class="logo">차<span>뽀</span>기</div>
    <div class="tagline">Coordinate Survival</div>
  </header>

  <main>
    <div class="panel" id="setupPanel">

      <div>
        <div class="section-label">반경 설정</div>
        <div class="radius-row" id="radiusRow">
          <div class="chip active" data-r="10">10km</div>
          <div class="chip" data-r="20">20km</div>
          <div class="chip" data-r="30">30km</div>
          <div class="chip" data-r="40">40km</div>
          <div class="chip" data-r="50">50km</div>
        </div>
      </div>

      <div class="toggle-row">
        <div>
          <div class="tlabel">1스팟을 현재 위치로 설정</div>
          <div class="tsub">끄면 아래 지역 내 랜덤 좌표로 시작</div>
        </div>
        <div class="switch" id="useGpsToggle"><div class="knob"></div></div>
      </div>

      <div class="region-wrap" id="regionWrap">
        <div class="rlabel2">지역 선택</div>
        <select id="regionSelect">
          <option value="all">전체</option>
          <option value="gg">경기도</option>
          <option value="gw">강원도</option>
          <option value="cb">충청북도</option>
          <option value="cn">충청남도</option>
          <option value="jb">전라북도</option>
          <option value="jn">전라남도</option>
          <option value="gb">경상북도</option>
          <option value="gn">경상남도</option>
          <option value="jj">제주도</option>
        </select>
      </div>

      <div class="readout">
        <div class="rlabel">출발 지점 (1번 스팟)</div>
        <div class="rval dim" id="startVal">미확정</div>
      </div>

      <button class="primary" id="btnStart">1번 스팟 찍기 (랜덤)</button>

      <div class="readout" id="targetReadout" style="display:none;">
        <div class="rlabel">타겟 스팟</div>
        <div class="rval" id="targetVal">생성됨 · 좌표 비공개</div>
      </div>

      <button class="primary" id="btnSpot" style="display:none;">타겟 스팟 생성</button>
      <button class="primary" id="btnFind" style="display:none;">찾기 모드 시작</button>
      <button class="ghost" id="btnReset" style="display:none;">처음부터 다시</button>
      <button class="ghost" id="btnHistory">지난 기록 보기</button>

      <div class="status" id="statusMsg"></div>
    </div>

    <div class="panel" id="historyPanel" style="display:none;">
      <div class="section-label">지난 찾기 기록</div>
      <div id="historyList"></div>
      <button class="ghost" id="btnHistoryBack">돌아가기</button>
    </div>
  </main>

  <div id="findScreen">
    <div class="find-label" id="findLabel">TARGET DISTANCE</div>
    <div class="ring-wrap">
      <svg viewBox="0 0 280 280">
        <circle class="ring-bg" cx="140" cy="140" r="120"></circle>
        <circle class="ring-fg" id="ringFg" cx="140" cy="140" r="120" stroke-dasharray="754" stroke-dashoffset="0"></circle>
      </svg>
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div class="dist-num" id="distNum">--</div>
        <div class="dist-unit">KM</div>
      </div>
    </div>
    <button class="find-exit" id="btnExitFind">찾기 모드 종료</button>
    <div class="log-panel" id="logPanel"></div>
  </div>

</div>

<script>
  const R_EARTH = 6371; // km
  let radiusKm = 10;
  let useGps = false;
  let startCoord = null;   // {lat, lng}
  let targetCoord = null;  // {lat, lng}
  let watchId = null;

  // 대한민국 및 도별 대략 경계 (근사 바운딩 박스, 콘텐츠용 간이 버전)
  const REGION_BOUNDS = {
    all: { latMin: 33.1, latMax: 38.6, lngMin: 125.0, lngMax: 129.6 },
    gg:  { latMin: 36.9, latMax: 38.3, lngMin: 126.3, lngMax: 127.9 }, // 경기도
    gw:  { latMin: 37.0, latMax: 38.6, lngMin: 127.5, lngMax: 129.4 }, // 강원도
    cb:  { latMin: 36.0, latMax: 37.2, lngMin: 127.3, lngMax: 128.6 }, // 충청북도
    cn:  { latMin: 35.9, latMax: 37.0, lngMin: 125.9, lngMax: 127.5 }, // 충청남도
    jb:  { latMin: 35.3, latMax: 36.2, lngMin: 126.4, lngMax: 127.9 }, // 전라북도
    jn:  { latMin: 33.9, latMax: 35.5, lngMin: 125.0, lngMax: 127.8 }, // 전라남도
    gb:  { latMin: 35.6, latMax: 37.0, lngMin: 128.0, lngMax: 129.6 }, // 경상북도
    gn:  { latMin: 34.6, latMax: 35.9, lngMin: 127.5, lngMax: 129.3 }, // 경상남도
    jj:  { latMin: 33.1, latMax: 33.6, lngMin: 126.1, lngMax: 126.9 }  // 제주도
  };

  function randomKoreaPoint() {
    const region = regionSelect.value;
    const b = REGION_BOUNDS[region] || REGION_BOUNDS.all;
    const lat = b.latMin + Math.random() * (b.latMax - b.latMin);
    const lng = b.lngMin + Math.random() * (b.lngMax - b.lngMin);
    return { lat, lng };
  }

  const statusMsg = document.getElementById('statusMsg');
  const startVal = document.getElementById('startVal');
  const targetReadout = document.getElementById('targetReadout');
  const btnStart = document.getElementById('btnStart');
  const btnSpot = document.getElementById('btnSpot');
  const btnFind = document.getElementById('btnFind');
  const btnReset = document.getElementById('btnReset');
  const findScreen = document.getElementById('findScreen');
  const distNum = document.getElementById('distNum');
  const ringFg = document.getElementById('ringFg');
  const findLabel = document.getElementById('findLabel');

  const RING_CIRC = 2 * Math.PI * 120;
  ringFg.setAttribute('stroke-dasharray', RING_CIRC.toFixed(1));

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      radiusKm = parseInt(chip.dataset.r, 10);
    });
  });

  function setStatus(msg, type) {
    statusMsg.textContent = msg || '';
    statusMsg.className = 'status' + (type ? ' ' + type : '');
  }

  function toRad(deg) { return deg * Math.PI / 180; }

  function haversine(a, b) {
    const dLat = toRad(b.lat - a.lat);
    const dLng = toRad(b.lng - a.lng);
    const lat1 = toRad(a.lat);
    const lat2 = toRad(b.lat);
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    return 2 * R_EARTH * Math.asin(Math.sqrt(h));
  }

  // random point within radiusKm of start, uniform over the disk area
  function randomPointWithin(center, maxKm) {
    const u = Math.random();
    const v = Math.random();
    const w = maxKm * Math.sqrt(u);
    const t = 2 * Math.PI * v;
    const dLat = (w * Math.cos(t)) / R_EARTH;
    const dLng = (w * Math.sin(t)) / (R_EARTH * Math.cos(toRad(center.lat)));
    return {
      lat: center.lat + dLat * 180 / Math.PI,
      lng: center.lng + dLng * 180 / Math.PI
    };
  }

  function fmtCoord(c) {
    return c.lat.toFixed(5) + ', ' + c.lng.toFixed(5);
  }

  const useGpsToggle = document.getElementById('useGpsToggle');
  const regionSelect = document.getElementById('regionSelect');
  const regionWrap = document.getElementById('regionWrap');

  useGpsToggle.addEventListener('click', () => {
    useGps = !useGps;
    useGpsToggle.classList.toggle('on', useGps);
    regionWrap.classList.toggle('disabled', useGps);
    btnStart.textContent = useGps ? '1번 스팟 찍기 (현재 위치)' : '1번 스팟 찍기 (랜덤)';
  });

  function confirmStart(coord) {
    startCoord = coord;
    startVal.textContent = fmtCoord(startCoord);
    startVal.classList.remove('dim');
    btnSpot.style.display = 'block';
    btnStart.textContent = useGps ? '1번 스팟 다시 찍기' : '1번 스팟 다시 찍기';
  }

  btnStart.addEventListener('click', () => {
    if (useGps) {
      if (!navigator.geolocation) {
        setStatus('이 브라우저는 위치 정보를 지원하지 않아요', 'err');
        return;
      }
      setStatus('위치 확인 중...');
      navigator.geolocation.getCurrentPosition(
        pos => {
          confirmStart({ lat: pos.coords.latitude, lng: pos.coords.longitude });
          setStatus('현재 위치로 1번 스팟이 설정됐어요', 'ok');
        },
        err => {
          setStatus('위치 접근이 거부됐어요. 브라우저 설정을 확인해주세요', 'err');
        },
        { enableHighAccuracy:true, timeout:10000 }
      );
    } else {
      confirmStart(randomKoreaPoint());
      setStatus('대한민국 내 랜덤 지점으로 1번 스팟이 설정됐어요', 'ok');
    }
  });

  btnSpot.addEventListener('click', () => {
    if (!startCoord) return;
    targetCoord = randomPointWithin(startCoord, radiusKm);
    targetReadout.style.display = 'block';
    document.getElementById('targetVal').textContent = '생성됨 · 좌표 비공개 (반경 ' + radiusKm + 'km)';
    btnFind.style.display = 'block';
    btnReset.style.display = 'block';
    btnSpot.textContent = '타겟 스팟 다시 생성';
    setStatus('타겟이 정해졌어요. 출발하세요!', 'ok');
  });

  btnReset.addEventListener('click', () => {
    startCoord = null;
    targetCoord = null;
    startVal.textContent = '미확정';
    startVal.classList.add('dim');
    targetReadout.style.display = 'none';
    btnSpot.style.display = 'none';
    btnFind.style.display = 'none';
    btnReset.style.display = 'none';
    btnStart.textContent = useGps ? '1번 스팟 찍기 (현재 위치)' : '1번 스팟 찍기 (랜덤)';
    btnSpot.textContent = '타겟 스팟 생성';
    setStatus('');
  });

  let lastKnownPos = null;   // {lat, lng}
  let logInterval = null;
  const logPanel = document.getElementById('logPanel');
  const MAX_LOG_LINES = 60;
  const STORAGE_KEY = 'chapogi_sessions_v1';
  const MAX_SESSIONS = 30;
  let currentSession = null; // {id, startedAt, radiusKm, startCoord, targetCoord, entries:[], arrived}

  function loadSessions() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveSessions(sessions) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    } catch (e) {
      // 저장 실패 (용량 초과 등) 시 조용히 무시
    }
  }

  function persistSession(session) {
    const sessions = loadSessions();
    sessions.unshift(session);
    while (sessions.length > MAX_SESSIONS) sessions.pop();
    saveSessions(sessions);
  }

  function sessionToCsv(session) {
    const rows = [['time', 'lat', 'lng', 'distance_km']];
    session.entries.forEach(e => {
      rows.push([e.t, e.lat ?? '', e.lng ?? '', e.dist ?? '']);
    });
    return rows.map(r => r.join(',')).join('\n');
  }

  function downloadCsv(session) {
    const csv = sessionToCsv(session);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date(session.startedAt).toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url;
    a.download = `chapogi-log-${dateStr}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  btnFind.addEventListener('click', () => {
    if (!targetCoord) return;
    logPanel.innerHTML = '';
    currentSession = {
      id: Date.now(),
      startedAt: new Date().toISOString(),
      radiusKm: radiusKm,
      startCoord: startCoord,
      targetCoord: targetCoord,
      entries: [],
      arrived: false
    };
    findScreen.classList.add('show');
    startWatch();
    startLogging();
  });

  document.getElementById('btnExitFind').addEventListener('click', () => {
    stopWatch();
    stopLogging();
    findScreen.classList.remove('show');
    finishSession();
  });

  function finishSession() {
    if (!currentSession) return;
    currentSession.endedAt = new Date().toISOString();
    if (currentSession.entries.length > 0) {
      persistSession(currentSession);
      downloadCsv(currentSession);
      setStatus('기록이 저장되고 CSV로 다운로드됐어요', 'ok');
    }
    currentSession = null;
  }

  function startWatch() {
    if (!navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(
      pos => {
        const here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        lastKnownPos = here;
        const dKm = haversine(here, targetCoord);
        updateFindUI(dKm);
      },
      err => {
        findLabel.textContent = 'GPS 신호 없음';
      },
      { enableHighAccuracy:true, maximumAge:1000, timeout:15000 }
    );
  }

  function stopWatch() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
  }

  function startLogging() {
    stopLogging(); // 안전하게 기존 인터벌 정리
    logInterval = setInterval(() => {
      const now = new Date();
      const ts = now.toTimeString().slice(0, 8); // HH:MM:SS

      let line;
      let entry = { t: ts };
      if (!lastKnownPos) {
        line = `[${ts}] GPS 신호 대기 중...`;
      } else {
        const dKm = haversine(lastKnownPos, targetCoord);
        const arrived = dKm < 0.05;
        const distStr = arrived ? '도착' : dKm.toFixed(3) + 'km';
        line = `[${ts}] ${lastKnownPos.lat.toFixed(5)}, ${lastKnownPos.lng.toFixed(5)} · 남은거리 ${distStr}`;
        entry.lat = lastKnownPos.lat.toFixed(6);
        entry.lng = lastKnownPos.lng.toFixed(6);
        entry.dist = dKm.toFixed(3);
        if (arrived && currentSession) currentSession.arrived = true;
      }

      if (currentSession) currentSession.entries.push(entry);

      const div = document.createElement('div');
      div.className = 'log-line';
      div.textContent = line;
      logPanel.prepend(div);

      while (logPanel.children.length > MAX_LOG_LINES) {
        logPanel.removeChild(logPanel.lastChild);
      }
    }, 1000);
  }

  function stopLogging() {
    if (logInterval !== null) {
      clearInterval(logInterval);
      logInterval = null;
    }
  }

  const setupPanel = document.getElementById('setupPanel');
  const historyPanel = document.getElementById('historyPanel');
  const historyList = document.getElementById('historyList');
  const btnHistory = document.getElementById('btnHistory');
  const btnHistoryBack = document.getElementById('btnHistoryBack');

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0') +
      ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function renderHistory() {
    const sessions = loadSessions();
    historyList.innerHTML = '';
    if (sessions.length === 0) {
      historyList.innerHTML = '<div class="hist-empty">아직 기록이 없어요</div>';
      return;
    }
    sessions.forEach(s => {
      const card = document.createElement('div');
      card.className = 'hist-card';
      const durSec = s.entries.length;
      const lastDist = s.entries.length ? s.entries[s.entries.length-1].dist : '-';
      card.innerHTML = `
        <div class="htitle">${fmtDate(s.startedAt)} · 반경 ${s.radiusKm}km ${s.arrived ? '· 🏁도착' : ''}</div>
        <div class="hsub">기록 ${durSec}개 · 마지막 남은거리 ${lastDist}km</div>
        <div class="hbtns">
          <button class="dl-btn">CSV 다운로드</button>
        </div>
      `;
      card.querySelector('.dl-btn').addEventListener('click', () => downloadCsv(s));
      historyList.appendChild(card);
    });
  }

  btnHistory.addEventListener('click', () => {
    setupPanel.style.display = 'none';
    historyPanel.style.display = 'flex';
    renderHistory();
  });

  btnHistoryBack.addEventListener('click', () => {
    historyPanel.style.display = 'none';
    setupPanel.style.display = 'flex';
  });

  function updateFindUI(dKm) {
    const arrived = dKm < 0.05; // 50m
    distNum.textContent = arrived ? '도착' : dKm.toFixed(2);
    distNum.classList.toggle('arrived', arrived);
    distNum.classList.toggle('pulse', arrived);
    findLabel.textContent = arrived ? 'TARGET REACHED' : 'TARGET DISTANCE';

    // ring: fill inversely proportional to distance vs initial radius setting
    const ratio = Math.max(0, Math.min(1, 1 - (dKm / radiusKm)));
    const offset = RING_CIRC * (1 - ratio);
    ringFg.style.strokeDashoffset = offset.toFixed(1);
    ringFg.style.stroke = arrived ? '#5cad7a' : '#ff6b35';
  }
</script>
</body>
</html>
